<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>메멘토 — 남은 시간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="scene"></canvas>

<header class="top">
  <button id="themeChip" class="chip" type="button" aria-label="주제 바꾸기">
    <span class="chip-dot"></span><span id="themeName">날씨</span>
  </button>
  <button id="openSettings" class="icon-btn" type="button" aria-label="설정">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
    </svg>
  </button>
</header>

<main class="words" id="words" hidden>
  <p class="label">인생을 하루로 치면</p>
  <h1 class="clock"><span id="clock"></span><small>무렵</small></h1>
  <p class="fraction"><span id="fraction"></span> <span class="season" id="season"></span></p>
  <button class="remain" id="remain" type="button" title="눌러서 다른 것 보기"></button>
  <p class="detail" id="detail" hidden></p>
  <p class="caption" id="caption"></p>
</main>

<footer class="lifeline" id="lifeline" hidden>
  <div class="track"><div class="done" id="lineDone"></div><div class="dot" id="lineDot"><span id="dotLabel">지금</span></div></div>
  <div class="ends"><span id="endL">태어난 날</span><span id="endR">마지막 날</span></div>
</footer>

<dialog id="settings">
  <form id="form" novalidate>
    <h2>나의 시간</h2>
    <div class="row two">
      <label>지금 나이
        <input id="fAge" type="number" min="0" max="149" step="0.1" inputmode="decimal" placeholder="예: 47">
      </label>
      <label>이만큼 살 것 같아요
        <input id="fLife" type="number" min="1" max="150" step="1" inputmode="numeric" placeholder="예: 85">
      </label>
    </div>
    <details class="more" id="birthBox">
      <summary>생일로 더 정확하게 (선택)</summary>
      <label>생년월일<input id="fBirth" type="date"></label>
      <p class="hint">넣으면 지금 나이는 생일로 계산해요. 비우면 위의 나이를 써요.</p>
    </details>

    <label>주제
      <input id="fTheme" type="text" maxlength="30" placeholder="아무 낱말이나 — 날씨, 바다, 커피…" autocomplete="off">
    </label>
    <div class="chips" id="themeChips"></div>
    <p class="hint match" id="themeMatch"></p>

    <fieldset id="placeBox">
      <legend>날씨 위치</legend>
      <div class="seg">
        <label><input type="radio" name="placeMode" value="geo">현재 위치</label>
        <label><input type="radio" name="placeMode" value="city">도시 고르기</label>
      </div>
      <div class="city" id="cityBox" hidden>
        <div class="city-row"><input id="fCity" type="text" placeholder="예: 대구" autocomplete="off"><button type="button" id="citySearch" class="ghost">찾기</button></div>
        <div class="results" id="cityResults"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>숫자</legend>
      <div class="seg">
        <label><input type="radio" name="detail" value="feel">느낌만</label>
        <label><input type="radio" name="detail" value="more">숫자도 보기</label>
      </div>
    </fieldset>

    <p class="error" id="formError" role="alert"></p>
    <div class="actions">
      <button type="button" id="cancelBtn" class="ghost">닫기</button>
      <button type="submit" class="primary">보기</button>
    </div>
  </form>
</dialog>

<script src="js/core.js"></script>
<!-- 주제 고르기는 아래 순서가 우선순위 -->
<script src="js/themes/moon.js"></script>
<script src="js/themes/space.js"></script>
<script src="js/themes/weather.js"></script>
<script src="js/themes/ocean.js"></script>
<script src="js/themes/tree.js"></script>
<script src="js/themes/season.js"></script>
<script src="js/themes/hourglass.js"></script>
<script src="js/themes/geometry.js"></script>
<script src="js/app.js"></script>
</body>
</html>
